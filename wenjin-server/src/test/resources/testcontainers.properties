# Windows Docker Desktop (Linux engine)
docker.client.strategy=org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy
# Prefer the Docker Desktop Linux engine pipe when multiple npipe endpoints exist
docker.host=npipe:////./pipe/dockerDesktopLinuxEngine
# Ryuk can fail under some Desktop versions; tests still clean via JUnit extension
testcontainers.reuse.enable=false
