# Eval profile (M6): reuses Flyway IT base; suite skipped when eval-enabled=false
spring:
  flyway:
    enabled: true
  sql:
    init:
      mode: never

wenjin:
  seed:
    enabled: false
  bootstrap:
    admin:
      enabled: false
  ai:
    enabled: false
  features:
    eval-enabled: true
    agent-trace-enabled: true
    fixed-diagnostic-enabled: true
    graph-reconcile-enabled: true
    ai-job-dispatch-enabled: false
    # R2：回放 / LIVE 评测固定纯全文检索（与 golden 基线一致、不依赖库里是否残留向量）；
    # 混合检索 / 召回评测 IT 在用例内显式开启并恢复
    rag-vector-enabled: false
