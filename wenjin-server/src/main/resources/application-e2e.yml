# Local e2e profile — points at isolated wenjin_e2e database
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wenjin_e2e?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useAffectedRows=true
    username: root
    password: root

wenjin:
  features:
    agent-trace-enabled: true
    eval-enabled: true
    memory-enabled: true
    rag-enabled: true
    rag-vector-enabled: true
    plan-enabled: true
    multi-agent-enabled: false
    proactive-enabled: true
    companion-llm-enabled: true
    reflection-enabled: true
    code-check-enabled: true          # 本机无 docker 时 available()=false → UNAVAILABLE
    teacher-assistant-enabled: true
  limits:
    rag:
      allow-hashing-embedding: true   # e2e 无嵌入 key 时用离线哈希嵌入跑混合检索
  companion:
    tools:
      enabled: true
  ai:
    enabled: true
    # deepseek-v4-pro 思考模式要求回传 reasoning_content；e2e 用 chat 模型更稳
    model: ${WENJIN_AI_MODEL:deepseek-chat}
