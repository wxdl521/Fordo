server:
  port: 8080                      # 后端服务端口，前端开发时通过 Vite proxy 转发到此
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  profiles:
    # 默认激活 dev：本地/开发启动无需带 --spring.profiles.active，AuthSecretGuard 放宽默认密钥。
    # 生产部署用环境变量 SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）覆盖，届时须配 WENJIN_AUTH_SECRET。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: wenjin-server
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库名 wenjin，请先用 schema.sql 建库建表（见根目录 README）
    # useAffectedRows=true：INSERT … ON DUPLICATE KEY 时 1=新插入 / 0=无变化（掌握度 insertEnsure 冷启动判定依赖）
    url: jdbc:mysql://localhost:3306/wenjin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useAffectedRows=true
    username: ${DB_USER:root}     # 可用环境变量 DB_USER 覆盖
    password: ${DB_PASSWORD:root} # 可用环境变量 DB_PASSWORD 覆盖
  # 不让应用自动执行 DDL（schema.sql 仅本地重建快照，生产禁用）
  sql:
    init:
      mode: never
  # Flyway 默认关闭：普通应用账号只有 DML；发布流水线用 migrator 凭据设 WENJIN_FLYWAY_ENABLED=true 跑一次迁移
  flyway:
    enabled: ${WENJIN_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # 调度线程池：AiJobWorker / payload cleanup / GraphDraftStore 共用；size=1 时长任务会饿死其余 @Scheduled
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: wj-sched-

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true          # 数据库下划线 <-> Java 驼峰自动映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期打印 SQL，便于排查
  global-config:
    db-config:
      id-type: auto                              # 主键自增，与 node_code 业务编码分离
      logic-delete-field: null

# 演示用固定身份（本阶段不做登录与权限）
wenjin:
  demo:
    teacher-id: 1                                # 写死的演示教师，导入图谱时作为课程创建者
    course-id: 1                                 # 写死的演示课程，AI 出题时的目标课程
  seed:
    enabled: false                               # 演示数据播种开关，默认关闭；仅本地演示前临时置 true（绝不在测试/生产开启）
  ai:                                            # AI 出题/标注（OpenAI 兼容，默认 DeepSeek）
    enabled: ${WENJIN_AI_ENABLED:true}
    base-url: ${WENJIN_AI_BASE_URL:https://api.deepseek.com}
    api-key: ${WENJIN_AI_API_KEY:}
    model: ${WENJIN_AI_MODEL:deepseek-v4-pro}
    temperature: 0.4
    vision:                                       # 多模态仅识图,可换更强模型;key 经环境变量注入勿硬编码
      enabled: ${WENJIN_AI_VISION_ENABLED:true}
      base-url: ${WENJIN_AI_VISION_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      api-key: ${WENJIN_AI_VISION_API_KEY:}
      model: ${WENJIN_AI_VISION_MODEL:glm-5v-turbo}
    embedding:                                    # RAG 向量检索的文本嵌入;无 key 时 available()=false,检索回退纯全文
      enabled: ${WENJIN_AI_EMBEDDING_ENABLED:false}
      base-url: ${WENJIN_AI_EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      api-key: ${WENJIN_AI_EMBEDDING_API_KEY:}
      model: ${WENJIN_AI_EMBEDDING_MODEL:embedding-3}
      dimension: ${WENJIN_AI_EMBEDDING_DIMENSION:1024}
      batch-size: ${WENJIN_AI_EMBEDDING_BATCH_SIZE:16}
  companion:
    tools:
      enabled: true
      max-rounds: 4
      max-tool-calls: 8              # 含 1 次副作用预留：最多约 7 次只读 + 1 次 start_practice
      timeout-ms: 5000
      max-result-chars: 2000
      intent-routing-enabled: true  # 练习意图路由：自然语言要题时强制 start_practice
    code-tool:                      # run_code_check（方向 6 / C3）
      max-per-run: 1
      source-max-chars: 10000
      stdin-max-chars: 2000
      stdout-preview-chars: 300
  limits:                                        # 资源预算（会话上下文 / 草稿 / 图片 / 文档）
    companion:
      max-input-chars: 4000                      # 单条用户输入上限
      max-ai-output-chars: 16000                 # 单轮 AI 输出累计上限（超出截断）
      max-context-chars: 32000                   # 送入模型的摘要+近窗总字符
      max-recent-messages: 20                    # 近窗保留最新消息条数
      list-default-limit: 30                     # 会话/消息列表默认 limit
      list-max-limit: 100                        # 会话/消息列表 limit 上限
    prompt:                                      # PromptAssembler 分槽预算（M7）
      system-chars: 8000
      skill-chars: 2000                          # 预留槽，当前恒空
      summary-chars: 8000
      memory-chars: 4000
      retrieval-chars: 4000                      # RETRIEVAL 槽（M8 rag-enabled 时注入）
      recent-chars: 16000
    memory:                                      # 长期记忆强度 / 去重 / 注入（M7）
      lambda: 0.05                               # effective = salience * exp(-λ * Δdays)
      jaccard-threshold: 0.6                     # ≥ 阈值视为同义，强化已有不插入
      max-content-chars: 500
      inject-top-k: 5                            # MEMORY 槽按 effective 注入条数
      write-per-run: 4                           # record_observation 每 run 上限
    rag:                                         # 语料检索 / 注入（M8）
      inject-top-k: 4                            # RETRIEVAL 注入 top-k
      search-default-top-k: 3                    # search_materials 默认 topK
      snippet-chars: 200                         # 工具返回 snippet 上限
      fusion-k: 60                               # R2 RRF 常数：score = Σ 1/(k + rank)
      candidate-multiplier: 3                    # R2 混合检索全文/向量各取 topK × 倍数候选
      vector-min-score: 0.2                      # R2 向量命中最低余弦
      allow-hashing-embedding: true              # R2 无真实嵌入时允许离线哈希嵌入（生产 false）
      query-cache-size: 512                      # R2 查询向量 LRU 条数（0 关闭）
      expand-prerequisites: true                 # R2 伴侣注入范围 = 焦点节点 + 直接前置
    draft:
      max-total: 100                             # 全局草稿上限
      max-per-user: 10                           # 单教师草稿上限
      max-nodes: 2000                            # 单草稿节点数上限
      max-edges: 5000                            # 单草稿边数上限
      ttl-minutes: 30                            # 草稿 TTL
      purge-interval-ms: 60000                   # 定时清理间隔
      max-bytes: 8000000                         # 单草稿字节估算上限
    image:
      max-dimension: 10000                       # 任一边像素上限
      max-pixels: 40000000                       # 总像素上限（40M）
      max-predicted-tiles: 12                    # 预测切片数上限
      target-width: 1600
      tile-height: 2200
      tile-overlap: 120
    document:
      max-pages: 200                             # PDF 页数上限
      max-text-chars: 200000                     # 抽取文本字符上限
      max-decompress-ratio: 100                  # 解压膨胀比上限
    trace:
      max-io-chars: 8000                         # agent_step I/O 截断阈值（超出加 [truncated]）
    tools:
      max-result-chars: 4000                     # 工具结果字符上限（Phase 3）
    plan:                                        # 学习计划算法 / brief（M10）
      daily-task-cap: 3                          # 每日任务上限
      weak-threshold: 60                         # weak：effective < 此值（0–100；规格 0.6→60）
      backlog-threshold: 5                       # daily-brief 复习积压置顶阈值
      max-scope-nodes: 42                        # draft_study_plan scope 上限
      weak-drop-limit: 2                         # brief 弱跌节点最多展示数
    supervisor:                                  # M11 Supervisor 抽查
      sample-size: 5                             # 每课程每周抽样 COMPANION_CHAT run 数
    proactive:                                   # 方向 4 主动陪伴
      max-opener-actions: 2                      # opener 动作卡上限
      max-hints-per-day: 3                       # 每日新展示提示条上限
      hint-cooldown-hours: 20                    # 同类型提示冷却小时数
      error-burst-threshold: 2                   # 单次练习错题数 >= 此值触发复盘动作/提示
      error-burst-window-hours: 24               # 错题爆发回看窗口

  features:                                      # 功能开关（开发/测试默认开；生产见 application-prod.yml）
    fixed-diagnostic-enabled: true
    graph-reconcile-enabled: true
    ai-job-dispatch-enabled: true
    agent-trace-enabled: true                    # Agent 执行轨迹埋点
    eval-enabled: true                           # 评测套件（M6）
    memory-enabled: true                         # 伴侣长期记忆（M7；关则 MEMORY 槽为空）
    rag-enabled: true                            # RAG 语料检索（M8；关则 RETRIEVAL 空、工具下架）
    rag-vector-enabled: true                     # R2 混合检索（全文+向量 RRF）；关或无嵌入客户端 → 纯全文
    reflection-enabled: true                     # M9 反思探针 / 换策略重讲
    companion-llm-enabled: true                  # M9 伴侣 LLM（关则零 LLM 降级模板）
    plan-enabled: true                           # M10 学习计划（关则工具下架、scheduler 不跑）
    multi-agent-enabled: false                   # M11 多智能体周报/抽查（默认关；关则零调度、报告 API 404）
    proactive-enabled: true                      # 方向 4 主动陪伴（opener/提示条/小红点；关则接口 404）
  plan:
    replan-cron: "0 30 4 * * *"                  # 每日 re-plan（默认 04:30）
  multi-agent:
    report-cron: "0 15 3 * * MON"                # 周一凌晨入队周报/抽查（仅 multi-agent-enabled）
  eval:                                          # 伴侣评测（M6）
    judge-model: ${WENJIN_EVAL_JUDGE_MODEL:}     # LLM-as-judge 模型；空则回落 wenjin.ai.model
    price:                                       # 评测成本估算单价（美元/百万 token）；0 表示不计成本
      input-per-mtok: ${WENJIN_EVAL_PRICE_IN:0}   # 输入 token 单价
      output-per-mtok: ${WENJIN_EVAL_PRICE_OUT:0} # 输出 token 单价
  jobs:                                          # AI 异步作业 worker
    poll-interval-ms: 2000                       # 领取轮询间隔
    heartbeat-interval-ms: 30000
    heartbeat-threads: 1
    payload-dir: ${WENJIN_JOB_PAYLOAD_DIR:./data/ai-job-payloads}
    payload-retention-hours: 168
    payload-cleanup-interval-ms: 3600000
    payload-cleanup-batch-size: 100
  diagnostic:                                    # 入口诊断组卷（T6）
    paper-size: 25                               # 诊断试卷目标题数（分层抽样上限）
    adaptive:                                     # 图引导自适应诊断（M2）
      budget: 15                                 # 题量预算：单次自适应诊断累计探针题数上限，耗尽即终止
  mastery:                                       # 掌握度计算（阶段三 EWMA）
    alpha: 0.3                                   # EWMA 平滑系数基准
    mastered-threshold: 75                       # 掌握度 ≥ 此值判为已掌握
    weak-threshold: 40                           # 掌握度 ≥ 此值判为薄弱，否则未学
    decay:                                       # 读时遗忘衰减（M3 ColorMap 染色，不写回库）
      enabled: true                              # false 时 effective≡raw，一键回退
      tau-days: 30                               # 衰减时间常数 τ（天），约 30 天可衰减部分衰减 63%
      floor: 25                                  # 衰减地板分，学过的高分不会退回完全未学
  review:                                        # 今日复习队列（M3 T5）
    daily-size: 5                                # 每日推荐复习节点数上限
  practice:                                      # 节点练习组卷（M1 练习闭环 T3）
    size: 5                                      # 默认每会话题数
    max-size: 10                                 # 每会话最大题数上限（超出自动夹紧）
    recency-days: 7                              # 组卷近期排除窗口（天），同学生任意场景已答过的题在窗口内不再出现
    distractor-threshold: 2                      # distractor 归因命中阈值（T5）：同一前置节点被错选命中次数 ≥ 此值才输出为薄弱前置
  auth:                                          # 令牌认证配置
    secret: ${WENJIN_AUTH_SECRET:dev-secret-change-me-in-prod}
    ttl-seconds: 604800                          # 令牌有效期 7 天
  mail:                                          # 注册验证码（个人实名走 SES API 模板；企业才可用 SMTP）
    enabled: ${WENJIN_MAIL_ENABLED:false}
    host: ${WENJIN_MAIL_HOST:gz-smtp.qcloudmail.com}
    port: ${WENJIN_MAIL_PORT:465}
    username: ${WENJIN_MAIL_USERNAME:}
    password: ${WENJIN_MAIL_PASSWORD:}
    from: ${WENJIN_MAIL_FROM:fordo@mail.thingxue.com}
    from-name: ${WENJIN_MAIL_FROM_NAME:问津项目组}
    ses:
      secret-id: ${WENJIN_SES_SECRET_ID:}
      secret-key: ${WENJIN_SES_SECRET_KEY:}
      region: ${WENJIN_SES_REGION:ap-guangzhou}
      template-id: ${WENJIN_SES_TEMPLATE_ID:0}
  bootstrap:                                     # 一次性首个 ADMIN 引导（见 DEPLOYMENT.md 2.3.1）；生产禁止常开
    admin:
      enabled: ${WENJIN_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${WENJIN_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${WENJIN_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    com.wenjin: debug
