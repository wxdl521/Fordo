# Reference only — NOT started by CI or by the app. Self-hosted Judge0 CE for wenjin.code-check.backend=judge0.
# Run on a DEDICATED host/VM (the judge0 containers are privileged so that isolate can manage cgroups).
# Upstream: https://github.com/judge0/judge0 (CE 1.13.x). Pin versions; review upstream release notes before upgrading.
#
#   cp judge0.conf.example judge0.conf   # set AUTHN_TOKEN / REDIS_PASSWORD / POSTGRES_PASSWORD
#   docker compose up -d db redis && sleep 10 && docker compose up -d
#   curl -H "X-Auth-Token: $TOKEN" http://127.0.0.1:2358/about
#
# Then on the wenjin host:
#   WENJIN_CODE_CHECK_BACKEND=judge0
#   WENJIN_CODE_CHECK_JUDGE0_URL=http://<judge0-host>:2358
#   WENJIN_CODE_CHECK_JUDGE0_TOKEN=<AUTHN_TOKEN>
#   WENJIN_FEATURE_CODE_CHECK=true
services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      # Bind to a private interface only; firewall it to the wenjin app host.
      - "127.0.0.1:2358:2358"
    privileged: true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    restart: always

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: always

volumes:
  data:
