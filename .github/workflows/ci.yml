name: CI

on:
  push:
    branches: [main, master, 'codex/**', 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'LIVE eval scenario codes, comma-separated (empty = all ENABLED)'
        required: false
        default: ''
      repeat:
        description: 'LIVE eval runs per scenario'
        required: false
        default: '3'
      judge:
        description: 'Run the LLM judge (true/false)'
        required: false
        default: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace / conflict marker gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git hash-object -t tree /dev/null)"
            fi
            git diff --check "$before..${{ github.sha }}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: wenjin-server/pom.xml

      # DockerSandboxIT (failsafe) runs untrusted-code sandbox checks in real containers; it fails (never skips)
      # when CI=true and Docker is missing. Pull the image once up front so the IT itself does not time out.
      - name: Pre-pull code sandbox image
        timeout-minutes: 5
        run: docker version && docker pull --quiet eclipse-temurin:21-jdk

      - name: Maven verify (tests + JaCoCo gates)
        working-directory: wenjin-server
        env:
          WENJIN_AI_API_KEY: ''
          WENJIN_AI_VISION_API_KEY: ''
          WENJIN_AUTH_SECRET: ci-test-secret-not-for-prod-at-least-32-bytes
        run: ./mvnw -B clean verify

      - name: Verify integration test reports exist
        working-directory: wenjin-server
        shell: bash
        run: compgen -G 'target/failsafe-reports/TEST-*IT.xml' > /dev/null

      - name: Upload surefire / failsafe / jacoco on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            wenjin-server/target/surefire-reports/**
            wenjin-server/target/failsafe-reports/**
            wenjin-server/target/site/jacoco/**
          if-no-files-found: ignore

  eval-replay:
    name: eval-replay
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: wenjin-server/pom.xml}
      # Unit tests of com.wenjin.eval.** plus the Docker-backed eval ITs (WENJIN_EVAL_IT=true):
      # ReplayScenarioIT replays every ENABLED scenario golden through the real companion
      # orchestrator + tools on a Testcontainers MySQL; LiveEvalPipelineIT runs the LIVE
      # pipeline with a scripted stub model; EvalFixtureIT covers the DB fixture.
      - run: ./mvnw -B -Dtest='com.wenjin.eval.**' test
        working-directory: wenjin-server
        env:
          WENJIN_AUTH_SECRET: ci-test-secret-not-for-prod-at-least-32-bytes
          WENJIN_AI_API_KEY: ''
          WENJIN_EVAL_IT: 'true'
      - name: Verify replay IT ran
        working-directory: wenjin-server
        shell: bash
        run: grep -q 'tests="[1-9]' target/surefire-reports/TEST-com.wenjin.eval.integration.ReplayScenarioIT.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            wenjin-server/target/eval-report.md
            wenjin-server/target/surefire-reports/*eval*
          if-no-files-found: ignore

  eval-live:
    name: eval-live
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: wenjin-server/pom.xml}
      - name: LIVE eval against the configured model
        working-directory: wenjin-server
        env:
          WENJIN_AUTH_SECRET: ci-test-secret-not-for-prod-at-least-32-bytes
          WENJIN_AI_API_KEY: ${{ secrets.WENJIN_AI_API_KEY }}
          WENJIN_EVAL_LIVE: 'true'
          EVAL_SCENARIOS: ${{ github.event.inputs.scenarios }}
          EVAL_REPEAT: ${{ github.event.inputs.repeat }}
          EVAL_JUDGE: ${{ github.event.inputs.judge }}
        shell: bash
        run: |
          if [[ -z "$WENJIN_AI_API_KEY" ]]; then
            echo "::error::secret WENJIN_AI_API_KEY is not set"; exit 1
          fi
          ./mvnw -B -Dtest=LiveEvalSuiteIT test "-Dwenjin.eval.scenarios=${EVAL_SCENARIOS}" "-Dwenjin.eval.repeat=${EVAL_REPEAT:-3}" "-Dwenjin.eval.judge=${EVAL_JUDGE:-true}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-live
          path: wenjin-server/target/eval-live/**
          if-no-files-found: warn

  frontend:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace / conflict marker gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git hash-object -t tree /dev/null)"
            fi
            git diff --check "$before..${{ github.sha }}"
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wenjin-web/package-lock.json

      - name: Install
        working-directory: wenjin-web
        run: npm ci

      - name: Lint, unit tests, build, bundle budget
        working-directory: wenjin-web
        run: npm run check

      - name: Coverage gate (store / composables / api / utils)
        working-directory: wenjin-web
        run: npm run test:coverage

      - name: Upload frontend reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            wenjin-web/coverage/**
            wenjin-web/dist/**
          if-no-files-found: ignore

  browser:
    name: browser-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace / conflict marker gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git hash-object -t tree /dev/null)"
            fi
            git diff --check "$before..${{ github.sha }}"
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wenjin-web/package-lock.json

      - name: Install
        working-directory: wenjin-web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: wenjin-web
        run: npx playwright install --with-deps chromium

      - name: Build frontend for preview
        working-directory: wenjin-web
        run: npm run build

      - name: Playwright Chromium smoke
        working-directory: wenjin-web
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            wenjin-web/playwright-report/**
            wenjin-web/test-results/**
          if-no-files-found: ignore
